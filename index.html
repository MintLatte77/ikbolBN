<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKBOL 스탯 계산기 v3</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; font-family: "Pretendard Variable", Pretendard, sans-serif; }
        
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #fff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; color: #000000; margin-bottom: 25px; font-weight: 800; letter-spacing: -1px; }

        /* 검색 섹션 */
        .search-box { 
            background-color: #eff6ff; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px;
            border: 1px solid #dbeafe;
        }
        .search-row { display: flex; gap: 8px; }
        .search-row input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #bfdbfe; 
            border-radius: 8px; 
            font-size: 16px;
        }
        .search-row button { 
            padding: 0 20px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
        }

        /* 상세 내역 */
        .details-box { 
            display: none; 
            margin-top: 15px; 
            background: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.85em; 
            border: 1px solid #e2e8f0;
        }
        .details-title { font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .details-row { display: flex; justify-content: space-between; margin-bottom: 4px; padding: 2px 0; border-bottom: 1px solid #f8fafc; }
        .details-row:last-child { border-bottom: none; }
        .val-buff { color: #15803d; font-weight: 600; }
        .val-nerf { color: #b91c1c; font-weight: 600; }

        /* 조작 그룹 (슬라이더 추가) */
        .control-group {
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
        }
        .control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .age-val { color: #2563eb; font-weight: 800; font-size: 1.1em; }
        
        input[type="range"] { 
            width: 100%; 
            margin: 10px 0; 
            cursor: pointer;
        }

        .army-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            margin-top: 5px;
        }

        /* 입력 그룹 */
        .input-group { margin-bottom: 18px; }
        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #4b5563; 
            margin-bottom: 6px; 
            margin-left: 2px;
        }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; text-align: center; }

        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 16px; 
            background-color: #f9fafb;
        }
        input:focus { outline: 2px solid #3b82f6; background-color: #fff; }

        /* 결과 창 */
        .result-box { 
            margin-top: 25px; 
            padding: 25px; 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
            color: white; 
            border-radius: 16px; 
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }
        .pure-text { font-size: 0.9em; opacity: 0.85; margin-bottom: 5px; }
        .final-score { font-size: 2.8em; font-weight: 800; color: #fbbf24; display: block; }

        .notice-text {
            display: block;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        .footer-area { margin-top: 20px; text-align: center; padding-bottom: 30px; }
        .footer-link a { 
            text-decoration: none; 
            color: #64748b; 
            font-size: 0.9em; 
            padding: 10px 20px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-block;
            margin-bottom: 15px;
        }
        .version-info { font-size: 0.75rem; color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚾ IKBOL 스탯 계산기 v3</h2>

    <div class="search-box">
        <div class="search-row">
            <input type="text" id="nicknameInput" placeholder="닉네임 입력">
            <button onclick="searchNickname()">조회</button>
        </div>
        <p id="searchMsg" style="margin: 10px 0px 0px; font-size: 0.8em; text-align: center; font-weight: 600; color: #64748b;">닉네임을 조회해주세요.</p>

        <div id="detailArea" class="details-box">
            <span class="details-title" id="dynamicTitle">🔍 버프 및 너프 내역</span>
            <div id="detailContent">
                </div>
        </div>
    </div>

    <div class="control-group">
        <div class="control-header">
            <label style="font-size:0.85rem; font-weight:700; color:#4b5563;">나이 설정</label>
            <span class="age-val"><span id="ageLabel">20</span>세</span>
        </div>
        <input type="range" id="ageSlider" min="20" max="55" value="20" oninput="updateAge()">
        <label class="army-label">
            <input type="checkbox" id="armyCheck" style="width:auto;" onchange="updateAge()"> 군필 여부 (21~23세 신인연장)
        </label>
    </div>

    <div class="input-group">
        <label>활동 스탯 (방문 / 게시글 / 댓글)</label>
        <div class="input-row">
            <input type="number" id="visits" placeholder="방문" oninput="calc()">
            <input type="number" id="posts" placeholder="글" oninput="calc()">
            <input type="number" id="comments" placeholder="댓글" oninput="calc()">
        </div>
    </div>

    <div class="input-group">
        <label style="color:#15803d;">총 버프(+)</label> 
        <input type="number" id="totalBuff" value="0" oninput="calc()" style="background:#f0fdf4; border-color:#bbf7d0;">
    </div>

    <div class="input-group">
        <label style="color:#b91c1c;">총 너프(-)</label> 
        <input type="number" id="totalNerf" value="0" oninput="calc()" style="background:#fef2f2; border-color:#fecaca;">
    </div>

    <div class="result-box">
        <div class="pure-text">순수 스탯: <span id="pureStats">0.00</span></div>
        <span class="final-score" id="finalStats">0.00</span>
        <div style="font-size:0.85em; opacity: 0.9;">최종 스탯</div>
    </div>
    <span class="notice-text">* 실제 스탯 계산은 소수 첫째 자리에서 반올림됩니다.</span>
</div>

<input type="hidden" id="h_pres" value="0"><input type="hidden" id="h_nat" value="0">
<input type="hidden" id="h_ew" value="0"><input type="hidden" id="h_em" value="0">
<input type="hidden" id="h_be" value="0"><input type="hidden" id="h_ret" value="0">
<input type="hidden" id="h_ne" value="0"><input type="hidden" id="h_army" value="0">

<div class="footer-area">
    <div class="footer-link">
        <a href="https://cafe.naver.com/best1ikbol" target="_blank">🏠 IKBOL 바로가기</a>
    </div>
    <div class="version-info">
        버전: v3.0.0b  최종 업데이트 날짜: 2026. 1. 31.
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9OUof1STrJMijMc-YcGrvpopnuYJESlMEGXbAmK-UzyVVg_naV4KA06GsE9goVqdy-A/exec"; 
    const W_VISIT = 1/70, W_POST = 1/30, W_COMMENT = 1/350;

    function updateAge() {
        const age = Number(document.getElementById('ageSlider').value);
        const isArmy = document.getElementById('armyCheck').checked;
        document.getElementById('ageLabel').innerText = age;

        // 신인 버프 계산
        let rb = 0;
        const rAge = isArmy ? age - 1 : age;
        if(rAge === 20) rb = 30; else if(rAge === 21) rb = 20; else if(rAge === 22) rb = 10;

        // 노화 너프 계산
        let an = 0;
        for (let i = 35; i <= age; i++) {
            if (i <= 36) an += 10; else if (i <= 39) an += 30; else if (i <= 42) an += 50; else an += 60;
        }

        // 시트 값 불러오기
        const d = {
            pres: Number(document.getElementById('h_pres').value),
            nat: Number(document.getElementById('h_nat').value),
            ew: Number(document.getElementById('h_ew').value),
            em: Number(document.getElementById('h_em').value),
            be: Number(document.getElementById('h_be').value),
            army: Number(document.getElementById('h_army').value),
            ret: Number(document.getElementById('h_ret').value),
            ne: Number(document.getElementById('h_ne').value)
        };

        // 리스트 업데이트
        document.getElementById('detailContent').innerHTML = `
            <div class="details-row"><span>보존 버프</span> <span class="val-buff">+${d.pres}</span></div>
            <div class="details-row"><span>신인 버프</span> <span class="val-buff">+${rb}</span></div>
            <div class="details-row"><span>군대 버프</span> <span class="val-buff">+${d.army}</span></div>
            <div class="details-row"><span>국대 버프</span> <span class="val-buff">+${d.nat}</span></div>
            <div class="details-row"><span>교육리그(승리)</span> <span class="val-buff">+${d.ew}</span></div>
            <div class="details-row"><span>교육리그(우수)</span> <span class="val-buff">+${d.em}</span></div>
            <div class="details-row"><span>기타 버프</span> <span class="val-buff">+${d.be}</span></div>
            <div style="border-top: 1px dashed #cbd5e1; margin: 8px 0;"></div>
            <div class="details-row"><span>은퇴 너프</span> <span class="val-nerf">-${d.ret}</span></div>
            <div class="details-row"><span>노화 너프</span> <span class="val-nerf">-${an}</span></div>
            <div class="details-row"><span>기타 너프</span> <span class="val-nerf">-${d.ne}</span></div>
        `;

        // 총합 칸 자동 입력
        document.getElementById('totalBuff').value = d.nat + d.ew + d.em + d.be + rb + d.army;
        document.getElementById('totalNerf').value = d.ne + an;

        calc();
    }

    function searchNickname() {
        const nick = document.getElementById('nicknameInput').value;
        const msg = document.getElementById('searchMsg');
        if(!nick) return;

        msg.innerText = "데이터 로딩 중...";
        msg.style.color = "#64748b";

        fetch(SCRIPT_URL + "?nickname=" + encodeURIComponent(nick))
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    msg.innerText = `✅ '${data.nickname}'님 버프 및 너프 적용 완료`;
                    msg.style.color = "#2563eb";
                    document.getElementById('dynamicTitle').innerText = `🔍 ${data.nickname}님의 버프 및 너프`;
                    
                    const d = data.details;
                    // 데이터 저장
                    document.getElementById('h_pres').value = d.preservation;
                    document.getElementById('h_nat').value = d.national;
                    document.getElementById('h_ew').value = d.eduWin;
                    document.getElementById('h_em').value = d.eduMvp;
                    document.getElementById('h_be').value = d.buffEtc;
                    document.getElementById('h_ret').value = d.retire;
                    document.getElementById('h_ne').value = d.nerfEtc;
                    document.getElementById('h_army').value = d.army;

                    // 나이 및 군필 자동 체크 로직
                    const sAge = Number(d.age) || 20;
                    document.getElementById('ageSlider').value = sAge;
                    // 신인버프(rookie) 값이 특정 나이대에 있으면 군필로 간주
                    document.getElementById('armyCheck').checked = (sAge >= 21 && d.rookie > 0 && (sAge - 20 < 4));

                    document.getElementById('detailArea').style.display = "block";
                    updateAge();
                } else {
                    msg.innerText = "❌ 정보를 찾을 수 없습니다.";
                    msg.style.color = "#ef4444";
                }
            });
    }

    function calc() {
        const v = Number(document.getElementById('visits').value) || 0;
        const p = Number(document.getElementById('posts').value) || 0;
        const c = Number(document.getElementById('comments').value) || 0;
        const buff = Number(document.getElementById('totalBuff').value) || 0;
        const nerf = Number(document.getElementById('totalNerf').value) || 0;
        const pres = Number(document.getElementById('h_pres').value) || 0;
        const ret = Number(document.getElementById('h_ret').value) || 0;

        const pure = (v * W_VISIT) + (p * W_POST) + (c * W_COMMENT) + pres - ret;
        const final = pure + (buff - pres) - (nerf - ret); // 이미 총합에 포함된 보존/은퇴 중복 방지

        document.getElementById('pureStats').innerText = pure.toFixed(2);
        document.getElementById('finalStats').innerText = final.toFixed(2);
    }
</script>
</body>
</html>
