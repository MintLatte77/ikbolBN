<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKBOL 스탯 계산기 v3</title>
    <style>
        /* 모바일 전체 화면 설정 */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            padding: 10px; 
            margin: 0; 
            background-color: #f4f7f9;
            width: 100%;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px; /* PC에서는 적당한 너비 유지 */
            margin: 0 auto;
        }
        h2 { text-align: center; color: #1a237e; margin-bottom: 20px; }
        
        /* 검색창 */
        .search-box { 
            background-color: #e3f2fd; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px;
        }
        .search-row { display: flex; gap: 8px; }
        .search-row input { flex: 1; padding: 10px; border: 1px solid #90caf9; border-radius: 6px; }
        .search-row button { 
            padding: 10px 15px; 
            background-color: #1976d2; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            font-weight: bold;
        }

        /* 상세 내역 (조회시 나타남) */
        .details-box { 
            display: none; 
            margin-top: 12px; 
            font-size: 0.85em; 
            border-top: 1px dashed #90caf9; 
            padding-top: 10px; 
        }
        .details-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #555; }

        /* 입력 그룹 */
        .input-group { 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; /* 모바일에서 글자 넘침 방지를 위해 세로 배치 권장 */
            gap: 5px;
        }
        .input-group label { font-weight: bold; color: #333; font-size: 0.9em; }
        .input-group input, .input-group select { 
            padding: 12px; 
            width: 100%; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 16px; /* 모바일 줌 현상 방지 */
        }

        /* 결과 창 */
        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            background: linear-gradient(135deg, #1a237e, #283593); 
            color: white; 
            border-radius: 10px; 
            text-align: center; 
        }
        .pure-text { font-size: 0.9em; opacity: 0.8; }
        .final-score { font-size: 2.5em; font-weight: bold; color: #ffeb3b; display: block; margin: 5px 0; }

        /* 하단 링크 */
        .footer-link {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 20px;
        }
        .footer-link a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .footer-link a:hover { background-color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚾ IKBOL 스탯 계산기 v3</h2>

    <div class="search-box">
        <div class="search-row">
            <input type="text" id="nicknameInput" placeholder="닉네임 입력">
            <button onclick="searchNickname()">조회</button>
        </div>
        <p id="searchMsg" style="margin: 8px 0 0 0; font-size: 0.8em; text-align: center;"></p>

        <div id="detailArea" class="details-box">
            <div id="detailContent"></div>
        </div>
    </div>

    <div class="input-group">
        <label>방문수 / 게시글 / 댓글</label>
        <div style="display:flex; gap:5px;">
            <input type="number" id="visits" placeholder="방문" oninput="calc()">
            <input type="number" id="posts" placeholder="게시글" oninput="calc()">
            <input type="number" id="comments" placeholder="댓글" oninput="calc()">
        </div>
    </div>

    <div class="input-group">
        <label>신인 버프 선택 (1~3년차)</label>
        <select id="yearSelect" onchange="calc()">
            <option value="0">해당 없음(4년차 이상)</option>
            <option value="30">1년차 (+30)</option>
            <option value="20">2년차 (+20)</option>
            <option value="10">3년차 (+10)</option>
        </select>
    </div>

    <div class="input-group">
        <label style="color:#2e7d32;">총 버프(+)</label> 
        <input type="number" id="totalBuff" value="0" oninput="calc()" style="background:#f1f8e9; border-color:#a5d6a7;">
    </div>

    <div class="input-group">
        <label style="color:#c62828;">총 너프(-)</label> 
        <input type="number" id="totalNerf" value="0" oninput="calc()" style="background:#fff1f1; border-color:#ef9a9a;">
    </div>

    <div class="result-box">
        <div class="pure-text">순수 스탯: <span id="pureStats">0</span></div>
        <span class="final-score" id="finalStats">0</span>
        <div style="font-size:0.8em; color:#e0e0e0;">최종 적용 스탯</div>
    </div>
</div>

<div class="footer-link">
    <a href="https://cafe.naver.com/best1ikbol" target="_blank">🏠 IKBOL 공식 카페 바로가기</a>
</div>

<script>
    const SCRIPT_URL = "여기에_새로_배포한_웹앱_URL_입력"; 

    // 가중치 (1/70 등)
    const W_VISIT = 1/70;
    const W_POST = 1/30;
    const W_COMMENT = 1/350;

    function searchNickname() {
        const nick = document.getElementById('nicknameInput').value;
        const msg = document.getElementById('searchMsg');
        const detailArea = document.getElementById('detailArea');
        const detailContent = document.getElementById('detailContent');

        if(!nick) { alert("닉네임을 입력해주세요!"); return; }
        msg.innerText = "데이터 로딩 중...";
        msg.style.color = "gray";

        fetch(SCRIPT_URL + "?nickname=" + encodeURIComponent(nick))
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    msg.innerText = "✅ '" + data.nickname + "'님 정보 적용 완료";
                    msg.style.color = "#1976d2";

                    // 상세 내역 텍스트 생성
                    const d = data.details;
                    let html = `
                        <div class="details-row"><span>보존/신인/군대:</span> <span>${d.preservation}/${d.rookie}/${d.army}</span></div>
                        <div class="details-row"><span>국대/교육(승/우):</span> <span>${d.national}/${d.eduWin}/${d.eduMvp}</span></div>
                        <div class="details-row"><span>기타 버프:</span> <span>${d.buffEtc}</span></div>
                        <div class="details-row" style="color:#c62828;"><span>은퇴/노화/기타너프:</span> <span>${d.retire}/${d.aging}/${d.nerfEtc}</span></div>
                    `;
                    detailContent.innerHTML = html;
                    detailArea.style.display = "block";

                    // 값 입력 (수정 가능하도록 설정됨)
                    document.getElementById('totalBuff').value = data.totalBuff;
                    document.getElementById('totalNerf').value = data.totalNerf;

                    calc();
                } else {
                    msg.innerText = "❌ 닉네임을 찾을 수 없습니다.";
                    msg.style.color = "red";
                }
            })
            .catch(() => { msg.innerText = "오류가 발생했습니다."; });
    }

    function calc() {
        const v = Number(document.getElementById('visits').value) || 0;
        const p = Number(document.getElementById('posts').value) || 0;
        const c = Number(document.getElementById('comments').value) || 0;
        const buff = Number(document.getElementById('totalBuff').value) || 0;
        const nerf = Number(document.getElementById('totalNerf').value) || 0;
        const year = Number(document.getElementById('yearSelect').value) || 0;

        const pure = (v * W_VISIT) + (p * W_POST) + (c * W_COMMENT);
        const final = pure + buff - nerf + year; 

        document.getElementById('pureStats').innerText = Math.round(pure).toLocaleString();
        document.getElementById('finalStats').innerText = Math.round(final).toLocaleString();
    }
</script>

</body>
</html>
