<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKBOL 스탯 계산기 v3</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; font-family: "Pretendard Variable", Pretendard, sans-serif; }
        
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #fff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; color: #000000; margin-bottom: 25px; font-weight: 800; letter-spacing: -1px; }

        /* 검색 섹션 */
        .search-box { 
            background-color: #eff6ff; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px;
            border: 1px solid #dbeafe;
        }
        .search-row { display: flex; gap: 8px; }
        .search-row input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #bfdbfe; 
            border-radius: 8px; 
            font-size: 16px;
        }
        .search-row button { 
            padding: 0 20px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
        }

        /* 상세 내역 */
        .details-box { 
            display: none; 
            margin-top: 15px; 
            background: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.85em; 
            border: 1px solid #e2e8f0;
        }
        .details-title { font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .details-row { display: flex; justify-content: space-between; margin-bottom: 4px; padding: 2px 0; border-bottom: 1px solid #f8fafc; }
        .details-row:last-child { border-bottom: none; }
        .val-buff { color: #15803d; font-weight: 600; }
        .val-nerf { color: #b91c1c; font-weight: 600; }

        /* 입력 그룹 */
        .input-group { margin-bottom: 18px; }
        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #4b5563; 
            margin-bottom: 6px; 
            margin-left: 2px;
        }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; text-align: center; }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 16px; 
            background-color: #f9fafb;
        }
        input:focus { outline: 2px solid #3b82f6; background-color: #fff; }

        /* 결과 창 */
        .result-box { 
            margin-top: 25px; 
            padding: 25px; 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
            color: white; 
            border-radius: 16px; 
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }
        .pure-text { font-size: 0.9em; opacity: 0.85; margin-bottom: 5px; }
        .final-score { font-size: 2.8em; font-weight: 800; color: #fbbf24; display: block; }

        .notice-text {
            display: block;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        /* 하단 링크 및 버전 정보 */
        .footer-area { margin-top: 20px; text-align: center; padding-bottom: 30px; }
        .footer-link a { 
            text-decoration: none; 
            color: #64748b; 
            font-size: 0.9em; 
            padding: 10px 20px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-block;
            margin-bottom: 15px;
        }
        .version-info {
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚾ IKBOL 스탯 계산기 v3</h2>

    <div class="search-box">
        <div class="search-row">
            <input type="text" id="nicknameInput" placeholder="닉네임 입력">
            <button onclick="searchNickname()">조회</button>
        </div>
        <p id="searchMsg" style="margin: 10px 0 0 0; font-size: 0.8em; text-align: center; font-weight: 600;"></p>

        <div id="detailArea" class="details-box">
            <span class="details-title" id="dynamicTitle">🔍 상세 데이터 내역</span>
            <div id="detailContent"></div>
        </div>
    </div>

    <div class="input-group">
        <label>활동 스탯 (방문 / 게시글 / 댓글)</label>
        <div class="input-row">
            <input type="number" id="visits" placeholder="방문" oninput="calc()">
            <input type="number" id="posts" placeholder="글" oninput="calc()">
            <input type="number" id="comments" placeholder="댓글" oninput="calc()">
        </div>
    </div>

    <div class="input-group">
        <label>신인 버프 연차 선택</label>
        <select id="yearSelect" onchange="calc()">
            <option value="0">해당 없음(4년차 이상)</option>
            <option value="30">1년차 (+30)</option>
            <option value="20">2년차 (+20)</option>
            <option value="10">3년차 (+10)</option>
        </select>
    </div>

    <div class="input-group">
        <label style="color:#15803d;">총 버프(+)</label> 
        <input type="number" id="totalBuff" value="0" oninput="calc()" style="background:#f0fdf4; border-color:#bbf7d0;">
    </div>

    <div class="input-group">
        <label style="color:#b91c1c;">총 너프(-)</label> 
        <input type="number" id="totalNerf" value="0" oninput="calc()" style="background:#fef2f2; border-color:#fecaca;">
    </div>

    <div class="result-box">
        <div class="pure-text">순수 스탯: <span id="pureStats">0</span></div>
        <span class="final-score" id="finalStats">0</span>
        <div style="font-size:0.85em; opacity: 0.9;">최종 스탯</div>
    </div>
    <span class="notice-text">* 실제 스탯 계산은 소수 첫째 자리에서 반올림됩니다.</span>
</div>

<div class="footer-area">
    <div class="footer-link">
        <a href="https://cafe.naver.com/best1ikbol" target="_blank">🏠 IKBOL 바로가기</a>
    </div>
    <div class="version-info">
        버전: v3.0.0b<br>
        업데이트 날짜: 2026년 1월 31일
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9OUof1STrJMijMc-YcGrvpopnuYJESlMEGXbAmK-UzyVVg_naV4KA06GsE9goVqdy-A/exec"; 

    const W_VISIT = 1/70;
    const W_POST = 1/30;
    const W_COMMENT = 1/350;

    // 소수점 셋째 자리에서 반올림하는 헬퍼 함수
    function roundToTwo(num) {
        return +(Math.round(num + "e+2") + "e-2");
    }

    function searchNickname() {
        const nick = document.getElementById('nicknameInput').value;
        const msg = document.getElementById('searchMsg');
        const detailArea = document.getElementById('detailArea');
        const detailContent = document.getElementById('detailContent');
        const title = document.getElementById('dynamicTitle');

        if(!nick) { alert("닉네임을 입력하세요."); return; }
        msg.innerText = "데이터 로딩 중...";
        msg.style.color = "#64748b";

        fetch(SCRIPT_URL + "?nickname=" + encodeURIComponent(nick))
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    msg.innerText = "✅ '" + data.nickname + "'님 버프 및 너프 적용 완료";
                    msg.style.color = "#2563eb";
                    
                    // 제목 변경
                    title.innerText = `🔍 ${data.nickname}님의 버프 및 너프`;

                    const d = data.details;
                    detailContent.innerHTML = `
                        <div class="details-row"><span>보존 버프</span> <span class="val-buff">+${d.preservation}</span></div>
                        <div class="details-row"><span>신인 버프</span> <span class="val-buff">+${d.rookie}</span></div>
                        <div class="details-row"><span>군대 버프</span> <span class="val-buff">+${d.army}</span></div>
                        <div class="details-row"><span>국대 버프</span> <span class="val-buff">+${d.national}</span></div>
                        <div class="details-row"><span>교육리그(승리)</span> <span class="val-buff">+${d.eduWin}</span></div>
                        <div class="details-row"><span>교육리그(우수)</span> <span class="val-buff">+${d.eduMvp}</span></div>
                        <div class="details-row"><span>기타 버프</span> <span class="val-buff">+${d.buffEtc}</span></div>
                        <div style="border-top: 1px dashed #cbd5e1; margin: 8px 0;"></div>
                        <div class="details-row"><span>은퇴 너프</span> <span class="val-nerf">-${d.retire}</span></div>
                        <div class="details-row"><span>노화 너프</span> <span class="val-nerf">-${d.aging}</span></div>
                        <div class="details-row"><span>기타 너프</span> <span class="val-nerf">-${d.nerfEtc}</span></div>
                    `;
                    detailArea.style.display = "block";

                    document.getElementById('totalBuff').value = data.totalBuff;
                    document.getElementById('totalNerf').value = data.totalNerf;
                    calc();
                } else {
                    msg.innerText = "❌ 정보를 찾을 수 없습니다.";
                    msg.style.color = "#ef4444";
                }
            })
            .catch(() => { msg.innerText = "오류가 발생했습니다."; });
    }

    function calc() {
        const v = Number(document.getElementById('visits').value) || 0;
        const p = Number(document.getElementById('posts').value) || 0;
        const c = Number(document.getElementById('comments').value) || 0;
        const buff = Number(document.getElementById('totalBuff').value) || 0;
        const nerf = Number(document.getElementById('totalNerf').value) || 0;
        const year = Number(document.getElementById('yearSelect').value) || 0;

        const pure = (v * W_VISIT) + (p * W_POST) + (c * W_COMMENT);
        const final = pure + buff - nerf + year; 

        // 결과값을 소수점 둘째 자리까지 표시 (셋째 자리에서 반올림)
        document.getElementById('pureStats').innerText = roundToTwo(pure).toLocaleString();
        document.getElementById('finalStats').innerText = roundToTwo(final).toLocaleString();
    }
</script>

</body>
</html>
