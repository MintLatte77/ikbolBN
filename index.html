<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKBOL 스탯 계산기 v3</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        /* 기본 레이아웃 */
        * {
            box-sizing: border-box;
            font-family: "Pretendard Variable", sans-serif;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* 상단 조회 섹션 */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222222;
            font-weight: 800;
        }

        .search-section {
            background: #f0f7ff;
            border: 1px solid #d0e3ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-row button {
            padding: 0 20px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 상세 데이터 리스트 */
        .detail-display {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
        }

        .detail-header {
            font-weight: 900;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 10px;
            color: #1e293b;
            font-size: 16px;
            text-align: center;
        }

        .detail-category {
            font-weight: 800;
            color: #475569;
            margin: 10px 0 5px 0;
            font-size: 13px;
            display: block;
            border-left: 3px solid #cbd5e1;
            padding-left: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f8f9fa;
            font-size: 14px;
        }

        .txt-blue { color: #2563eb; font-weight: bold; }
        .txt-red { color: #dc2626; font-weight: bold; }

        /* 나이 조작 */
        .control-section {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin: 10px 0;
        }

        .army-check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #444444;
            cursor: pointer;
        }

        /* 입력창 및 결과 */
        .input-label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #666666;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-row input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .edit-row input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .input-buff { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0 !important; }
        .input-nerf { background-color: #fef2f2; color: #991b1b; border-color: #fecaca !important; }

        .result-panel {
            background: #1e293b;
            color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .pure-val { font-size: 13px; opacity: 0.7; margin-bottom: 5px; }
        .final-val { font-size: 44px; font-weight: 900; color: #fbbf24; display: block; line-height: 1; }
        .info-tag { margin-top: 15px; display: none; font-size: 12px; background: rgba(255, 255, 255, 0.15); padding: 4px 12px; border-radius: 20px; }

        .footer { margin-top: 25px; text-align: center; }
        .cafe-link { text-decoration: none; color: #475569; background: #ffffff; border: 1px solid #e2e8f0; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; }
        .version-txt { margin-top: 15px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚾ IKBOL 스탯 계산기 v3</h2>

    <div class="search-section">
        <div class="search-row">
            <input type="text" id="nickInput" placeholder="닉네임 입력">
            <button onclick="fetchData()">조회</button>
        </div>
        <div id="statusMsg" style="text-align:center; margin-top:10px; font-size:13px; font-weight:bold;"></div>
        
        <div id="detailView" class="detail-display">
            <div id="nickTitle" class="detail-header">님의 버프 및 너프</div>
            <div id="viewRows"></div>
        </div>
    </div>

    <div class="control-section">
        <div class="control-header">
            <span>나이 설정</span>
            <span class="txt-blue"><span id="ageLabel">20</span>세</span>
        </div>
        <input type="range" id="ageSlider" min="20" max="55" value="20" oninput="updateByAge()">
        <label class="army-check-label">
            <input type="checkbox" id="armyCheck" onchange="updateByAge()"> 신인 버프 연장 (군대)
        </label>
    </div>

    <label class="input-label">활동 데이터 입력 (방문 / 글 / 댓글)</label>
    <div class="input-row">
        <input type="number" id="vIn" placeholder="방문" oninput="calculate()">
        <input type="number" id="pIn" placeholder="글" oninput="calculate()">
        <input type="number" id="cIn" placeholder="댓글" oninput="calculate()">
    </div>

    <label class="input-label">총 버프 및 너프</label>
    <div class="edit-row">
        <input type="number" id="totalBuff" class="input-buff" placeholder="0" oninput="calculate()">
        <input type="number" id="totalNerf" class="input-nerf" placeholder="0" oninput="calculate()">
    </div>

    <div class="result-panel">
        <div class="pure-val">순수 스탯 : <span id="pureLabel">0.00</span></div>
        <span class="final-val" id="finalLabel">0.00</span>
        <div class="info-tag" id="ageTag"></div>
    </div>

    <input type="hidden" id="sheetPreservation" value="0">
    <input type="hidden" id="sheetRetire" value="0">
    <input type="hidden" id="sheetNational" value="0">
    <input type="hidden" id="sheetEduWin" value="0">
    <input type="hidden" id="sheetEduMvp" value="0">
    <input type="hidden" id="sheetBuffEtc" value="0">
    <input type="hidden" id="sheetNerfEtc" value="0">
</div>

<div class="footer">
    <a href="https://cafe.naver.com/best1ikbol" class="cafe-link" target="_blank">🏠 IKBOL 바로가기</a>
    <div class="version-txt">v3.0.0b 2026.01.31.</div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcjfUCdhce96y24UmI-Mo5lBXswpNHFyaYrFYEL48ZtVLNe2xUAp31ceKpFGq3W0QBpQ/exec";
    const WV = 1/70, WP = 1/30, WC = 1/350;

    function updateByAge() {
        const age = Number(document.getElementById('ageSlider').value);
        const isArmy = document.getElementById('armyCheck').checked;
        document.getElementById('ageLabel').innerText = age;

        let rb = 0;
        const rAge = isArmy ? age - 1 : age;
        if(rAge === 20) rb = 30; else if(rAge === 21) rb = 20; else if(rAge === 22) rb = 10;

        let an = 0;
        for (let i = 35; i <= age; i++) {
            if (i <= 36) an += 10; else if (i <= 39) an += 30; else if (i <= 42) an += 50; else an += 60;
        }

        const d = {
            pres: Number(document.getElementById('sheetPreservation').value),
            nat: Number(document.getElementById('sheetNational').value),
            ew: Number(document.getElementById('sheetEduWin').value),
            em: Number(document.getElementById('sheetEduMvp').value),
            be: Number(document.getElementById('sheetBuffEtc').value),
            ret: Number(document.getElementById('sheetRetire').value),
            ne: Number(document.getElementById('sheetNerfEtc').value)
        };

        // 이미지와 동일한 리스트 구성 (신인/노화 포함)
        document.getElementById('viewRows').innerHTML = `
            <span class="detail-category">버프 리스트</span>
            <div class="detail-row"><span>보존 버프</span><span class="txt-blue">+${d.pres}</span></div>
            <div class="detail-row"><span>신인 버프</span><span class="txt-blue">+${rb}</span></div>
            <div class="detail-row"><span>국대 버프</span><span class="txt-blue">+${d.nat}</span></div>
            <div class="detail-row"><span>교육리그 우승팀</span><span class="txt-blue">+${d.ew}</span></div>
            <div class="detail-row"><span>교육리그 우수 활동자</span><span class="txt-blue">+${d.em}</span></div>
            <div class="detail-row"><span>기타 버프</span><span class="txt-blue">+${d.be}</span></div>

            <span class="detail-category">너프 리스트</span>
            <div class="detail-row"><span>은퇴 너프</span><span class="txt-red">-${d.ret}</span></div>
            <div class="detail-row"><span>노화 너프</span><span class="txt-red">-${an}</span></div>
            <div class="detail-row"><span>기타 너프</span><span class="txt-red">-${d.ne}</span></div>

        `;

        document.getElementById('totalBuff').value = d.nat + d.ew + d.em + d.be + rb;
        document.getElementById('totalNerf').value = d.ne + an;

        calculate();
    }

    function fetchData() {
        const nick = document.getElementById('nickInput').value;
        if(!nick) return;
        document.getElementById('statusMsg').innerText = "조회 중...";
        
        fetch(SCRIPT_URL + "?nickname=" + encodeURIComponent(nick))
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    document.getElementById('statusMsg').innerText = "✅ 데이터 로드 성공";
                    // 닉네임 타이틀 업데이트
                    document.getElementById('nickTitle').innerText = nick + "님의 버프 및 너프";
                    
                    const d = data.details;
                    document.getElementById('sheetPreservation').value = d.preservation;
                    document.getElementById('sheetRetire').value = d.retire;
                    document.getElementById('sheetNational').value = d.national;
                    document.getElementById('sheetEduWin').value = d.eduWin;
                    document.getElementById('sheetEduMvp').value = d.eduMvp;
                    document.getElementById('sheetBuffEtc').value = d.buffEtc;
                    document.getElementById('sheetNerfEtc').value = d.nerfEtc;
                    
                    document.getElementById('ageSlider').value = d.age || 20;
                    document.getElementById('detailView').style.display = "block";
                    updateByAge();
                } else {
                    document.getElementById('statusMsg').innerText = "❌ 검색 결과 없음";
                }
            });
    }

    function calculate() {
        const v = Number(document.getElementById('vIn').value) || 0;
        const p = Number(document.getElementById('pIn').value) || 0;
        const c = Number(document.getElementById('cIn').value) || 0;
        const sP = Number(document.getElementById('sheetPreservation').value) || 0;
        const sR = Number(document.getElementById('sheetRetire').value) || 0;
        const tB = Number(document.getElementById('totalBuff').value) || 0;
        const tN = Number(document.getElementById('totalNerf').value) || 0;

        const act = (v * WV) + (p * WP) + (c * WC);
        const pure = act + sP - sR;
        const final = pure + tB - tN;

        document.getElementById('pureLabel').innerText = pure.toFixed(2);
        document.getElementById('finalLabel').innerText = final.toFixed(2);

        const tag = document.getElementById('ageTag');
        const age = Number(document.getElementById('ageSlider').value);
        const isArmy = document.getElementById('armyCheck').checked;
        const rAge = isArmy ? age - 1 : age;
        let rbVal = 0; if(rAge === 20) rbVal = 30; else if(rAge === 21) rbVal = 20; else if(rAge === 22) rbVal = 10;
        let anVal = 0; for (let i = 35; i <= age; i++) { if (i <= 36) anVal += 10; else if (i <= 39) anVal += 30; else if (i <= 42) anVal += 50; else anVal += 60; }

        if (rbVal > 0 || anVal > 0) {
            tag.style.display = "inline-block";
            tag.innerText = rbVal > 0 ? `신인 버프 +${rbVal}` : `노화 너프 -${anVal}`;
        } else {
            tag.style.display = "none";
        }
    }
</script>
</body>
</html>
