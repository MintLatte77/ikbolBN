<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKBOL 스탯 계산기 v3</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        /* 기본 레이아웃 설정 */
        * { 
            box-sizing: border-box; 
            font-family: "Pretendard Variable", Pretendard, sans-serif; 
        }

        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #fff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }

        h2 { 
            text-align: center; 
            color: #000; 
            margin-bottom: 25px; 
            font-weight: 800; 
            letter-spacing: -1px; 
        }

        /* 검색 섹션 스타일 */
        .search-box { 
            background-color: #eff6ff; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #dbeafe; 
        }

        .search-row { 
            display: flex; 
            gap: 8px; 
        }

        .search-row input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #bfdbfe; 
            border-radius: 8px; 
            font-size: 16px; 
        }

        .search-row button { 
            padding: 0 20px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        
        /* 상세 내역 출력함 */
        .details-box { 
            display: none; 
            margin-top: 15px; 
            background: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.85em; 
            border: 1px solid #e2e8f0; 
        }

        .details-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 4px; 
            padding: 2px 0; 
            border-bottom: 1px solid #f8fafc; 
        }

        /* 나이 컨트롤 스타일 */
        .age-control { 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            margin-bottom: 18px; 
        }

        .age-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
        }

        .age-val { 
            color: #2563eb; 
            font-weight: 800; 
            font-size: 1.1rem; 
        }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
        }

        .army-check { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: #475569; 
            margin-top: 10px; 
        }

        /* 입력 폼 스타일 */
        .input-group { 
            margin-bottom: 18px; 
        }

        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #4b5563; 
            margin-bottom: 6px; 
        }

        .input-row { 
            display: flex; 
            gap: 8px; 
        }

        input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 16px; 
            text-align: center; 
        }
        
        /* 결과 박스 스타일 */
        .result-box { 
            margin-top: 25px; 
            padding: 25px; 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
            color: white; 
            border-radius: 16px; 
            text-align: center; 
        }

        .final-score { 
            font-size: 2.8em; 
            font-weight: 800; 
            color: #fbbf24; 
            display: block; 
        }

        #ageEffectDesc { 
            font-size: 0.8em; 
            margin-top: 10px; 
            color: #fff; 
            background: rgba(0,0,0,0.2); 
            padding: 5px 12px; 
            border-radius: 20px; 
            display: inline-block; 
        }

        .footer-area { 
            margin-top: 20px; 
            text-align: center; 
            padding-bottom: 30px; 
        }

        .version-info { 
            font-size: 0.75rem; 
            color: #94a3b8; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚾ IKBOL 스탯 계산기 v3</h2>

    <div class="search-box">
        <div class="search-row">
            <input type="text" id="nicknameInput" placeholder="닉네임 입력">
            <button onclick="searchNickname()">조회</button>
        </div>
        <p id="searchMsg" style="margin: 10px 0 0 0; font-size: 0.8em; text-align: center; font-weight: 600;"></p>
        <div id="detailArea" class="details-box"></div>
    </div>

    <div class="age-control">
        <div class="age-header">
            <label style="font-weight: 700; font-size: 0.85rem; color: #4b5563;">선수 나이 조작 (20~55세)</label>
            <span class="age-val"><span id="ageDisplay">20</span>세</span>
        </div>
        <input type="range" id="ageSlider" min="20" max="55" value="20" oninput="updateAge(this.value)">
        <label class="army-check">
            <input type="checkbox" id="armyCheck" onchange="calc()"> 군필 (신인버프 연령 +1)
        </label>
    </div>

    <div class="input-group">
        <label>활동 스탯 (방문 / 게시글 / 댓글)</label>
        <div class="input-row">
            <input type="number" id="visits" placeholder="방문" oninput="calc()">
            <input type="number" id="posts" placeholder="글" oninput="calc()">
            <input type="number" id="comments" placeholder="댓글" oninput="calc()">
        </div>
    </div>

    <input type="hidden" id="fixedBuff" value="0">
    <input type="hidden" id="fixedNerf" value="0">

    <div class="result-box">
        <div style="font-size: 0.9em; opacity: 0.8;">순수 스탯: <span id="pureStats">0.00</span></div>
        <span class="final-score" id="finalStats">0.00</span>
        <div style="font-size:0.85em; opacity: 0.9;">최종 스탯</div>
        <div id="ageEffectDesc">나이 영향 없음</div>
    </div>
    <span style="display:block; text-align:center; font-size:0.7rem; color:#94a3b8; margin-top:10px;">* 소수 첫째 자리 반올림 반영됨</span>
</div>

<div class="footer-area">
    <div class="version-info">v3.0.0b 2026.01.31.</div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcjfUCdhce96y24UmI-Mo5lBXswpNHFyaYrFYEL48ZtVLNe2xUAp31ceKpFGq3W0QBpQ/exec"; 

    // 가중치 설정
    const W_VISIT = 1/70; 
    const W_POST = 1/30; 
    const W_COMMENT = 1/350;

    // 반올림 처리 함수
    function roundToTwo(num) { 
        return +(Math.round(num + "e+2") + "e-2"); 
    }

    // 나이 업데이트 함수
    function updateAge(val) {
        document.getElementById('ageDisplay').innerText = val;
        calc();
    }

    // 닉네임 조회 함수
    function searchNickname() {
        const nick = document.getElementById('nicknameInput').value;
        const msg = document.getElementById('searchMsg');
        if(!nick) { alert("닉네임을 입력하세요."); return; }
        
        msg.innerText = "데이터 불러오는 중...";
        msg.style.color = "#64748b";
        
        fetch(SCRIPT_URL + "?nickname=" + encodeURIComponent(nick))
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    msg.innerText = `✅ '${data.nickname}' 데이터 적용됨`;
                    msg.style.color = "#2563eb";
                    
                    const d = data.details;
                    
                    // 1. 나이 설정 (최소 20, 최대 55 제한)
                    const initialAge = Math.max(20, Math.min(55, d.age));
                    document.getElementById('ageSlider').value = initialAge;
                    document.getElementById('ageDisplay').innerText = initialAge;

                    // 2. 고정 버프/너프 합산 (나이와 관계없는 항목들)
                    const b = (Number(d.preservation)||0) + (Number(d.army)||0) + (Number(d.national)||0) + 
                              (Number(d.eduWin)||0) + (Number(d.eduMvp)||0) + (Number(d.buffEtc)||0);
                    const n = (Number(d.nerfEtc)||0);
                    
                    document.getElementById('fixedBuff').value = b;
                    document.getElementById('fixedNerf').value = n;

                    // 3. UI 업데이트
                    document.getElementById('detailArea').innerHTML = `
                        <div style="font-weight:700; color:#1e3a8a; margin-bottom:8px; border-bottom:1px solid #e2e8f0; padding-bottom:4px;">🔍 고정 데이터 (시트 기준)</div>
                        <div class="details-row"><span>고정 버프 합계</span> <span style="color:#15803d; font-weight:600;">+${b}</span></div>
                        <div class="details-row"><span>기타 너프 합계</span> <span style="color:#b91c1c; font-weight:600;">-${n}</span></div>
                    `;
                    document.getElementById('detailArea').style.display = "block";
                    calc();
                } else {
                    msg.innerText = "❌ 검색 결과가 없습니다.";
                    msg.style.color = "#ef4444";
                }
            })
            .catch(err => {
                msg.innerText = "❌ 서버 연결 오류";
                msg.style.color = "#ef4444";
            });
    }

    // 메인 계산 함수
    function calc() {
        const age = Number(document.getElementById('ageSlider').value);
        const isArmy = document.getElementById('armyCheck').checked;
        
        const v = Number(document.getElementById('visits').value) || 0;
        const p = Number(document.getElementById('posts').value) || 0;
        const c = Number(document.getElementById('comments').value) || 0;
        
        const fixedBuff = Number(document.getElementById('fixedBuff').value) || 0;
        const fixedNerf = Number(document.getElementById('fixedNerf').value) || 0;

        // 1. 신인 버프 계산 (비누적)
        let rookieVal = 0;
        const checkAge = isArmy ? age - 1 : age;
        if(checkAge === 20) rookieVal = 30;
        else if(checkAge === 21) rookieVal = 20;
        else if(checkAge === 22) rookieVal = 10;

        // 2. 누적 너프 계산 (매년 누적)
        let cumulativeAgeNerf = 0;
        for (let i = 35; i <= age; i++) {
            if (i <= 36) cumulativeAgeNerf += 10;
            else if (i <= 39) cumulativeAgeNerf += 30;
            else if (i <= 42) cumulativeAgeNerf += 50;
            else cumulativeAgeNerf += 60;
        }

        // 3. 스탯 합계
        const pure = (v * W_VISIT) + (p * W_POST) + (c * W_COMMENT);
        const final = pure + fixedBuff + rookieVal - fixedNerf - cumulativeAgeNerf;

        // 4. 결과 출력
        document.getElementById('pureStats').innerText = roundToTwo(pure).toFixed(2);
        document.getElementById('finalStats').innerText = roundToTwo(final).toFixed(2);
        
        // 5. 나이 영향 텍스트 업데이트
        let effectTxt = "";
        if(rookieVal > 0) effectTxt = `신인 버프 +${rookieVal}`;
        else if(cumulativeAgeNerf > 0) effectTxt = `누적 노화 너프 -${cumulativeAgeNerf}`;
        else effectTxt = `나이 영향 없음`;
        
        document.getElementById('ageEffectDesc').innerText = effectTxt;
    }
</script>

</body>
</html>
